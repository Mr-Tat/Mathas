<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math'as</title>
  <link rel="icon" type="image/png" href="https://jftzuslpelgzbdrftszw.supabase.co/storage/v1/object/public/mathas-images/logos/lettre-m-3d-de-mathematiques-en-collage-1791015091641-1oed9jb.png" />
  <link rel="apple-touch-icon" href="https://jftzuslpelgzbdrftszw.supabase.co/storage/v1/object/public/mathas-images/logos/lettre-m-3d-de-mathematiques-en-collage-1791015091641-1oed9jb.png" />
  <link rel="stylesheet" href="styles.css?v=20261003-brand-v2-smaller" />
</head>
<body>
  <div class="math-bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand-block">
      <img class="brand-wordmark" src="https://jftzuslpelgzbdrftszw.supabase.co/storage/v1/object/public/mathas-images/logos/logo-3d-mathematiques-colore-1791015093060-1256uhr.png" alt="Math'as" />
      <p class="brand-subtitle">Les maths de M. Tatas</p>
      <p id="classLabel" class="class-badge">Classe</p>
    </div>
  </header>

  <main class="page-shell">
    <section class="daily-section panel panel-hero" aria-labelledby="dailyTitle">
      <div class="section-heading">
        <div class="title-row title-row-large">
          <h2 id="dailyTitle">Sélection du jour</h2>
          <span id="dailyCount" class="count-pill">0 app</span>
        </div>
      </div>

      <div id="dailyApps" class="app-grid daily-grid empty-grid">
        <p class="empty-state">Aucune application sélectionnée pour le moment.</p>
      </div>
    </section>

    <div id="levels"></div>
  </main>

  <template id="levelTemplate">
    <section class="level panel collapsed">
      <button class="level-toggle" type="button" aria-expanded="false">
        <span class="level-heading-group">
          <span class="level-title"></span>
          <small class="level-description"></small>
        </span>
        <span class="level-spacer"></span>
        <span class="level-count count-pill">0 app</span>
        <span class="chevron">⌄</span>
      </button>
      <div class="level-content">
        <div class="app-grid level-apps"></div>
      </div>
    </section>
  </template>

  <template id="appTemplate">
    <a class="app-card" href="#">
      <div class="app-thumb"><span class="app-initial">M</span></div>
      <div class="app-meta">
        <strong class="app-name">Application</strong>
        <small class="app-scores">Pas encore de score</small>
      </div>
    </a>
  </template>

  <script src="config.js?v=20261003-brand-v1"></script>
  <script src="app.js?v=20261003-brand-v1"></script>
</body>
</html>
