<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math'as</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="math-bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand-block">
      <h1>Math'as</h1>
      <p class="brand-subtitle">Le hub du cours de math de Monsieur Tatas</p>
      <p id="classLabel" class="class-badge">Classe</p>
    </div>
    <button id="teacherBtn" class="ghost-btn" type="button" title="Accès enseignant">Enseignant</button>
  </header>

  <main class="page-shell">
    <section class="daily-section panel panel-hero" aria-labelledby="dailyTitle">
      <div class="section-heading decorated-heading">
        <div>
          <p class="section-kicker">Aujourd'hui</p>
          <div class="title-row">
            <h2 id="dailyTitle">Sélection du jour</h2>
            <span id="dailyCount" class="count-pill">0 app</span>
          </div>
        </div>
        <div class="heading-motif" aria-hidden="true">★ + − × ÷</div>
      </div>
      <div id="dailyApps" class="app-grid empty-grid">
        <p class="empty-state">Aucune application sélectionnée pour le moment.</p>
      </div>
    </section>

    <div id="levels"></div>
  </main>

  <template id="levelTemplate">
    <section class="level panel collapsed">
      <button class="level-toggle" type="button" aria-expanded="false">
        <span class="level-main">
          <span class="level-title"></span>
          <span class="level-count count-pill">0 app</span>
        </span>
        <span class="level-symbols" aria-hidden="true">∑  △  ½</span>
        <span class="chevron">⌄</span>
      </button>
      <div class="level-content"></div>
    </section>
  </template>

  <template id="domainTemplate">
    <section class="domain-card">
      <button class="domain-toggle" type="button" aria-expanded="false">
        <span class="domain-main">
          <span class="domain-title"></span>
          <span class="domain-count count-pill small">0 app</span>
        </span>
        <span class="domain-deco" aria-hidden="true"></span>
        <span class="chevron">⌄</span>
      </button>
      <div class="domain-content" hidden>
        <div class="category-list"></div>
      </div>
    </section>
  </template>

  <template id="categoryTemplate">
    <article class="category-card">
      <button class="category-toggle" type="button" aria-expanded="false">
        <span class="category-name"></span>
        <span class="category-count"></span>
      </button>
      <div class="category-content" hidden>
        <div class="app-grid category-apps"></div>
      </div>
    </article>
  </template>

  <template id="appTemplate">
    <a class="app-card" href="#">
      <div class="app-thumb"><span class="app-initial">M</span></div>
      <div class="app-meta">
        <strong class="app-name">Application</strong>
        <small class="app-scores">Pas encore de score</small>
      </div>
    </a>
  </template>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
